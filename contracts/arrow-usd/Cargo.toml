[package]
name = "arrow-usd"
description = "Testnet-only NEP-141 with a public, per-call-capped mint (judge path, red-team section 4.1)"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { workspace = true }
near-contract-standards = { workspace = true }

[dev-dependencies]
near-sdk = { workspace = true, features = ["unit-testing"] }
