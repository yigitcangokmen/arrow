[package]
name = "arrow"
description = "Arrow market contract: mt_on_transfer (Intents) -> OutLayer request_execution -> on_eval/on_release"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/yigitcangokmen/arrow"

[lib]
crate-type = ["cdylib", "rlib"]

# NEP-330 reproducible build (`cargo near build reproducible-wasm`, scripts/build-contracts.sh --reproducible).
# Keys from the cargo-near 0.23.0 `cargo near new` template; the image is the template's sourcescan/cargo-near
# 0.22.0 line on Rust 1.97.1 (rust-toolchain.toml), digest checked on Docker Hub. --no-abi as in every other build.
[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.22.0-rust-1.97.1"
image_digest = "sha256:7467038bdddc86484b73b416eeadce926ff59013e128e53dec5a19e1cb4b2234"
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked", "--no-abi"]

[features]
# Enables ft_on_transfer (arrow-usd on testnet) and per-account / global daily eval caps. Never in the mainnet build.
testnet = []

[dependencies]
near-sdk = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
near-sdk = { workspace = true, features = ["unit-testing"] }
near-workspaces = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
