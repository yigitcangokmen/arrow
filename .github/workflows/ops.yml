# H-23 upkeep check every 3 hours (X12-OPS-3): tank, paused, program key and hash, FastFS URL, OutLayer secret row, NEAR AI probe, relayer,
# hosted routes. Read-only. A failed run emails the repo's watchers, so an outage lasts hours, not a day.
# One-time setup by a human (repo settings): secrets NEARAI_API_KEY and NEARAI_API_KEY_MAINNET (the probe sends max_tokens 1),
# variable NEXT_PUBLIC_SITE_DOMAIN. The mainnet leg stays off until the market is deployed: set the variable OPS_MAINNET to true after H-12.
name: ops
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
permissions: { contents: read }
jobs:
  testnet:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npx tsx scripts/src/balances.ts --network testnet --ops
        env:
          NEXT_PUBLIC_SITE_DOMAIN: ${{ vars.NEXT_PUBLIC_SITE_DOMAIN }}
          NEARAI_API_KEY: ${{ secrets.NEARAI_API_KEY }}
          NEARAI_API_KEY_MAINNET: ${{ secrets.NEARAI_API_KEY_MAINNET }}
  mainnet:
    runs-on: ubuntu-24.04
    if: vars.OPS_MAINNET == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npx tsx scripts/src/balances.ts --network mainnet --ops
        env:
          NEXT_PUBLIC_SITE_DOMAIN: ${{ vars.NEXT_PUBLIC_SITE_DOMAIN }}
          NEARAI_API_KEY: ${{ secrets.NEARAI_API_KEY }}
          NEARAI_API_KEY_MAINNET: ${{ secrets.NEARAI_API_KEY_MAINNET }}
