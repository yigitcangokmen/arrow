[package]
name = "s1-spike"
version = "0.1.0"
edition = "2021"
publish = false

# Own workspace: spikes are excluded from the root workspace (W1-08).
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.1"
serde_json = "1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
