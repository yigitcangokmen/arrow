[workspace]
resolver = "2"
members = [
    "contracts/arrow",
    "contracts/arrow-usd",
    "contracts/mock-outlayer",
    "enclave/arrow-core",
    "enclave/arrow-tee",
    "spikes/s4/rust-interop",
]
exclude = ["spikes"]

# Versions verified 2026-11-09 (crates.io + out-layer/private-dao-example Cargo.lock). See KICKOFF.md section 2.3.
# Enclave crates stay on the RustCrypto generation that ecies 0.2.11 uses (k256 0.13, hkdf 0.12, sha2 0.10,
# chacha20poly1305 0.10, rand_core 0.6). Do not bump one without the others.
[workspace.dependencies]
# Contracts (Rust >= 1.95: near-sdk 5.30.1 rust_version)
near-sdk = "5.30.1"
near-contract-standards = "5.30.1"
near-workspaces = { version = "0.24.0", features = ["unstable"] }
tokio = { version = "1", features = ["full"] }

# Shared
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"

# Enclave (wasm32-wasip2)
wasi-http-client = "0.2"
ecies = { version = "=0.2.11", default-features = false, features = ["pure"] }
libsecp256k1 = "0.7"
k256 = { version = "0.13", features = ["ecdh", "arithmetic"] }
hkdf = "0.12"
sha2 = "0.10"
chacha20poly1305 = "0.10"
rand_chacha = "0.3"
csv = "1"
regex = "1"
# G5 injection scan (DECISIONS F-09)
unicode-normalization = "0.1"
base64 = "0.22"

# One release profile for the whole workspace (member profiles are ignored by cargo).
# Same settings as the cargo-near template; panic=abort is the only option on wasm32 anyway.
[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
